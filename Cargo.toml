[package]
name = "plugin_rollpig"
version = "0.1.0"
edition = "2024"
description = "随机猪猪图 - 从 api 获取随机猪猪图片"

[package.metadata]
tags = ["pigpig", "image"]

[lib]
crate-type = ["cdylib"]

[dependencies]
luo9_sdk = "0.7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
